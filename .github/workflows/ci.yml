name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - run: pip install .
        name: Install project

      - run: pip install pytest ruff bandit flake8 black
        name: Install test and lint tools

      - run: black --check --diff .
        name: black format check

      - run: ruff check .
        name: ruff check

      - run: flake8 .
        name: flake8

      - run: bandit -r . -ll
        continue-on-error: true
        name: bandit

      - run: python -m pytest tests/ -v -W error::DeprecationWarning -W error::sqlalchemy.exc.LegacyAPIWarning
        name: pytest
