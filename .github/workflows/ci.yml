name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install .
        name: Install project

      - run: pip install pytest ruff bandit
        name: Install test and lint tools

      - run: ruff check .
        continue-on-error: true
        name: ruff check

      - run: bandit -r . -ll
        continue-on-error: true
        name: bandit

      - run: python -m pytest tests/ -v
        name: pytest
