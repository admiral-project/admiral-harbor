name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install .
        name: Install project

      - run: pip install pytest
        name: Install test runner

      - run: python -m pytest tests/ -v
        name: pytest
