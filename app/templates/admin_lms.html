{% extends "admin_layout.html" %}
{% block title %}NOW-LMS Settings - Admiral Harbor{% endblock %}
{% block content %}
<section class="page-header compact">
 <div>
 <h1>NOW-LMS integration</h1>
 <p class="lede">Connection settings for academy visibility and remote enrollments.</p>
 </div>
</section>

<section class="panel">
 <form method="post" class="stack">
 <label>Base URL <input name="base_url" value="{{ settings.base_url or '' }}"></label>
 <label>API Key <input name="api_key" value="{{ settings.encrypted_api_key or '' }}"></label>
 <label class="checkbox-row"><input type="checkbox" name="enabled" {% if settings.enabled %}checked{% endif %}> Enabled</label>
 <button class="primary page-cta" type="submit">Save</button>
 </form>
</section>
{% endblock %}
