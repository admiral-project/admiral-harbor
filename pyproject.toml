[build-system]
requires = ["flit_core>=3.8"]
build-backend = "flit_core.buildapi"

[project]
name = "admiral-harbor"
version = "0.0.1beta17"
description = "Admiral customer portal"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "werkzeug>=3.0.6",
    "flask-sqlalchemy>=3.1",
    "flask-login>=0.6.3",
    "flask-alembic>=3.1.1",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "mistune>=3.0.2",
    "PyYAML>=6.0.1",
]

[tool.flit.module]
name = "app"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "SIM117", "G201", "S110", "DTZ001", "RUF012", "EXE001", "SIM102", "SIM103", "SIM115", "RUF059"]
